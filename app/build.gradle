plugins {
    id "com.android.application"
}

def gitSha = System.getenv("GITHUB_SHA") ?: "local"
def mnnCommit = "d407447ed56c4121a11ccbd266dc184ca1ead0c2"

android {
    namespace "dev.riszn.androidtrainer"
    compileSdk 35
    ndkVersion "27.2.12479018"

    defaultConfig {
        applicationId "dev.riszn.androidtrainer"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0-gpu-gate"

        buildConfigField "String", "GIT_SHA", "\"" + gitSha + "\""
        buildConfigField "String", "MNN_COMMIT", "\"" + mnnCommit + "\""

        ndk { abiFilters "arm64-v8a" }

        externalNativeBuild {
            cmake {
                arguments "-DMNN_ROOT=" + rootProject.projectDir + "/vendor/MNN",
                          "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17", "-O3", "-ffp-contract=off"
            }
        }
    }

    buildFeatures { buildConfig true }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs { useLegacyPackaging = false }
    }
}

dependencies {}
